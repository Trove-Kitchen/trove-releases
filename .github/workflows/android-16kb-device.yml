name: Trove Android 16 KB device check

# Runs trove-app's SpeechModelDeviceTest on an Android 15 emulator with 16 KB
# memory pages (system-images;android-35;google_apis_ps16k;x86_64): the page
# size is 16384, the Vosk speech model loads its native libraries (libvosk.so,
# JNA's libjnidispatch.so), and it transcribes a short spoken clip. Play
# requires 16 KB page support; this is the device half of that check
# (android-play.yml checks the libraries' alignment).
#
# This repository is public and trove-app is private. The log shows a one-line
# verdict and per-test pass/fail; the Gradle log stays on the runner.

run-name: 'Trove Android 16 KB device check of ${{ inputs.ref }}'

on:
  workflow_dispatch:
    inputs:
      ref:
        description: trove-app branch, tag or commit
        required: true
        default: main
        type: string

concurrency:
  group: trove-android-16kb-device-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Mint a read-only token for the source
        id: source-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TROVE_CI_APP_ID }}
          private-key: ${{ secrets.TROVE_CI_APP_PRIVATE_KEY }}
          owner: Trove-Kitchen
          repositories: trove-app

      - id: source
        uses: ./.github/actions/fetch-source
        with:
          ref: ${{ inputs.ref }}
          token: ${{ steps.source-token.outputs.token }}

      - name: Build the app and its device tests without any credential
        working-directory: ${{ runner.temp }}/trove-source/android
        run: |
          mkdir -p "$RUNNER_TEMP/private"
          gradle --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest \
            > "$RUNNER_TEMP/private/gradle.log" 2>&1 \
            || { echo "The debug build failed; run Trove Android unit tests for the errors."; exit 1; }
          echo "build passed"

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the speech test on a 16 KB page-size emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_ps16k
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: tools/run_16kb_device.sh

      - name: Remove private source and logs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/trove-source" "$RUNNER_TEMP/private"
