name: Apple sign-in secret reminder

# Supabase's Sign in with Apple client secret (web) is a JWT Apple caps at
# 6 months. Opens an issue 30 days before TROVE_APPLE_SIWA_SECRET_EXPIRES
# (repo variable, YYYY-MM-DD). Regenerate from TROVE_APPLE_SIWA_P8 in
# Bitwarden, update Supabase auth, then bump the variable.
on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Open an issue when expiry is near
        env:
          GH_TOKEN: ${{ github.token }}
          EXPIRES: ${{ vars.TROVE_APPLE_SIWA_SECRET_EXPIRES }}
        run: |
          if [ -z "$EXPIRES" ]; then echo "TROVE_APPLE_SIWA_SECRET_EXPIRES not set"; exit 1; fi
          days=$(( ( $(date -d "$EXPIRES" +%s) - $(date +%s) ) / 86400 ))
          echo "Apple client secret expires $EXPIRES ($days days)"
          [ "$days" -gt 30 ] && exit 0
          title="Renew the Sign in with Apple client secret (expires $EXPIRES)"
          if gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq 'length' | grep -qv '^0$'; then exit 0; fi
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "Web Sign in with Apple stops working on $EXPIRES.

          1. Make a new ES256 JWT from \`TROVE_APPLE_SIWA_P8\` (Bitwarden trove): kid US5697RWXS, iss R6A892D599, sub ade-studios.Munch-RKCK.web, aud https://appleid.apple.com, exp at most 180 days.
          2. Set it as the Apple secret in Supabase auth (production), and update \`TROVE_APPLE_SIWA_CLIENT_SECRET\` in Bitwarden.
          3. Update the repo variable \`TROVE_APPLE_SIWA_SECRET_EXPIRES\`."
