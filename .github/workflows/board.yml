name: Trove flow board

# Rebuilds the flow board (review-pages pattern) in trove-renders board/ after every device-test or web-flow
# run: trove-app's docs/evidence/flows.json (data only, no trove-app code runs) plus the verdicts and
# screenshots already in trove-renders. A session publishes board/ to its stable claude.ai URL
# (trove-app docs/engineering/artifacts.md). The log shows counts only.

run-name: 'Trove flow board (flows from ${{ inputs.ref || ''main'' }})'

on:
  workflow_run:
    workflows: ['Trove device tests', 'Trove web flows']
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: trove-app branch, tag or commit to read docs/evidence/flows.json from
        required: true
        default: main
        type: string

concurrency:
  group: trove-renders-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Mint a read-only token for trove-app
        id: source-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TROVE_CI_APP_ID }}
          private-key: ${{ secrets.TROVE_CI_APP_PRIVATE_KEY }}
          owner: Trove-Kitchen
          repositories: trove-app

      - name: Mint the trove-kitchen-renders token
        id: renders-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TROVE_RENDERS_APP_ID }}
          private-key: ${{ secrets.TROVE_RENDERS_APP_PRIVATE_KEY }}
          owner: Trove-Kitchen
          repositories: trove-renders

      - run: python3 -m pip install -q --user pillow

      - name: Build and commit the board
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          RENDERS_TOKEN: ${{ steps.renders-token.outputs.token }}
          REF: ${{ inputs.ref || 'main' }}
        run: |
          printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$' || { echo "ref must be a branch, tag or commit"; exit 1; }
          flows="$RUNNER_TEMP/flows.json"
          curl -fsS -H "Authorization: Bearer $SOURCE_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/Trove-Kitchen/trove-app/contents/docs/evidence/flows.json?ref=$REF" -o "$flows" \
            || { echo "trove-app has no docs/evidence/flows.json at that ref"; exit 1; }
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RENDERS_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          for attempt in 1 2 3 4; do
            work="$RUNNER_TEMP/renders"; rm -rf "$work"
            git init -q "$work"
            git -C "$work" -c http.extraheader="$auth" fetch -q --depth 1 https://github.com/Trove-Kitchen/trove-renders.git main
            git -C "$work" checkout -q -B main FETCH_HEAD
            python3 -I tools/board.py "$work" "$flows"
            git -C "$work" add -A board
            if git -C "$work" diff --cached --quiet; then echo "board: unchanged"; exit 0; fi
            git -C "$work" -c user.name=trove-kitchen-renders -c user.email=renders@trove-releases.invalid \
              commit -q -m "Flow board from trove-app $REF"
            if git -C "$work" -c http.extraheader="$auth" push -q https://github.com/Trove-Kitchen/trove-renders.git HEAD:refs/heads/main; then
              echo "board: committed to trove-renders board/"; exit 0
            fi
            echo "trove-renders main moved; retrying ($attempt)."
          done
          exit 1
