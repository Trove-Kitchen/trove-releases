name: Trove iOS renders

# Builds Trove for the simulator at a trove-app ref and screenshots it on an
# iPhone simulator in light and dark mode, with the debug launch settings the app
# supports:
#   - the four tabs with the shared sample account (MUNCH_SKIP_ONBOARDING,
#     MUNCH_SCREENSHOT_SEED, MUNCH_START_TAB)
#   - a recipe page and guided cooking (MUNCH_START_RECIPE, MUNCH_START_COOKING)
#   - the component gallery's three pages (MUNCH_COMPONENT_GALLERY=1|2|3)
#
# trove-app is private and this repository is public, so the screenshots never
# land here: they're committed to the private Trove-Kitchen/trove-renders repo,
# in its layout (README there): one folder per trove-app commit, first 12 hex
# digits, holding ios/*.png and a README, newest 10 kept and listed newest first
# in runs.json. Written with a trove-kitchen-renders token. This log shows
# counts only.

run-name: 'Trove iOS renders${{ (!inputs.ref || inputs.ref == ''main'') && '' of main'' || '''' }}'

on:
  workflow_dispatch:
    inputs:
      ref:
        description: trove-app branch, tag or commit
        required: true
        default: main
        type: string
      device:
        description: Simulator device name (an iPad works too, e.g. iPad Pro 13-inch (M4))
        required: false
        default: iPhone 17 Pro
        type: string
      runner:
        description: macOS runner image; macos-26 has Xcode 26 and the iOS 26 simulator (Liquid Glass)
        required: false
        default: macos-26
        type: string

concurrency:
  # By run, never by branch name: a group's name can show in this public log.
  group: trove-ios-renders-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 75
    env:
      BUNDLE_ID: ade-studios.Munch-RKCK
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Mint a read-only token for the source
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.TROVE_CI_APP_ID }}
          private-key: ${{ secrets.TROVE_CI_APP_PRIVATE_KEY }}
          owner: Trove-Kitchen
          repositories: trove-app,trove-commerce
          permission-contents: read

      # trove-app branch names are private and a step's inputs are echoed in this
      # public log, so the ref is read from the event and only its commit is used.
      - name: Resolve the ref to a commit, printing no branch name
        id: commit
        env:
          TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          ref="$(jq -r '.inputs.ref // ""' "$GITHUB_EVENT_PATH")"
          [ -n "$ref" ] || ref=main
          if printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            sha="$ref"
          else
            printf '%s' "$ref" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$' || { echo "ref must be a branch, tag or full commit"; exit 1; }
            auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            echo "::add-mask::$auth"
            # A branch first, then a tag's commit.
            sha="$(git -c http.extraheader="$auth" ls-remote https://github.com/Trove-Kitchen/trove-app.git \
              "refs/heads/$ref" "refs/tags/$ref" | awk -v r="$ref" '
                $2 == "refs/heads/" r { h = $1 } $2 == "refs/tags/" r "^{}" { p = $1 } $2 == "refs/tags/" r { t = $1 }
                END { print h ? h : (p ? p : t) }')"
          fi
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "ref is not a trove-app branch, tag or full commit"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - id: source
        uses: ./.github/actions/fetch-source
        with:
          ref: ${{ steps.commit.outputs.sha }}
          token: ${{ steps.source-token.outputs.token }}
          with_commerce: 'true'

      - name: Use the newest Xcode on this runner
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version | head -1
          xcrun simctl list runtimes | grep -i ios | tail -2

      - name: Build for the simulator without signing
        working-directory: ${{ runner.temp }}/trove-source
        run: |
          mkdir -p "$RUNNER_TEMP/private"
          if xcodebuild \
            -workspace Munch.xcworkspace \
            -scheme Munch \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/private/build.log" 2>&1; then
            echo "build passed"
          else
            python3 -I "$GITHUB_WORKSPACE/tools/report.py" xcode "$RUNNER_TEMP/private/build.log" /dev/null
            echo "Build failed; run Trove iOS compile for the errors."
            exit 1
          fi

      - name: Install AXe (reads the simulator's accessibility tree)
        run: brew install cameroncooke/axe/axe >/dev/null 2>&1 && axe --version || echo "AXe unavailable"

      - name: Screenshot the tabs and the component gallery, light and dark
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          app="$(find "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)"
          udid="$(xcrun simctl create trove-renders "$DEVICE")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b >/dev/null
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$udid" "$app"
          out="$RUNNER_TEMP/private/renders" && mkdir -p "$out"
          shoot() {  # name, then KEY=VALUE pairs for the app's environment
            local name="$1"; shift
            xcrun simctl terminate "$udid" "$BUNDLE_ID" 2>/dev/null || true
            echo "== $name" >> "$out/launch.log"
            # The unsigned build has no iCloud entitlement, so CloudKit stays off.
            env SIMCTL_CHILD_MUNCH_DISABLE_CLOUDKIT=1 "$@" xcrun simctl launch "$udid" "$BUNDLE_ID" MUNCH_SKIP_ONBOARDING >> "$out/launch.log" 2>&1 || echo "launch failed: $?" >> "$out/launch.log"
            sleep 8
            if xcrun simctl spawn "$udid" launchctl list 2>/dev/null | grep -q "$BUNDLE_ID"; then
              echo "running" >> "$out/launch.log"
            else
              echo "NOT running after 8s" >> "$out/launch.log"
            fi
            xcrun simctl io "$udid" screenshot "$out/$name.png" >/dev/null 2>&1
            # The goal screens' accessibility trees, for the library check below.
            case "$name" in components-*) ;; *)
              for attempt in 1 2 3; do
                axe describe-ui --udid "$udid" > "$out/$name.ax.json" 2>/dev/null || true
                python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$out/$name.ax.json" 2>/dev/null && break
                sleep 2
              done ;;
            esac
          }
          for appearance in light dark; do
            xcrun simctl ui "$udid" appearance "$appearance"
            for tab in recipes mealPlan grocery profile; do
              shoot "$tab-$appearance" SIMCTL_CHILD_MUNCH_SCREENSHOT_SEED=1 SIMCTL_CHILD_MUNCH_START_TAB="$tab"
            done
            # A recipe page and guided cooking, from the same sample account.
            shoot "recipe-$appearance" SIMCTL_CHILD_MUNCH_SCREENSHOT_SEED=1 SIMCTL_CHILD_MUNCH_START_RECIPE=Pancakes
            shoot "cooking-$appearance" SIMCTL_CHILD_MUNCH_SCREENSHOT_SEED=1 SIMCTL_CHILD_MUNCH_START_RECIPE=Pancakes SIMCTL_CHILD_MUNCH_START_COOKING=1
            for page in 1 2 3; do
              shoot "components-$page-$appearance" SIMCTL_CHILD_MUNCH_COMPONENT_GALLERY="$page"
            done
          done
          echo "$(ls "$out"/*.png | wc -l | tr -d ' ') screenshots, $(grep -c 'NOT running' "$out/launch.log" || true) without the app running"
          # Every button on the goal screens is a library component or a spec exception:
          # each marks itself with a trove. accessibility identifier. Names and counts only.
          python3 -I "$GITHUB_WORKSPACE/tools/ax_check.py" "$out" || true
          # Crash reports stay private: they go to trove-renders with the screenshots.
          find ~/Library/Logs/DiagnosticReports -name '*Munch*' -newer "$app" -exec cp {} "$out/" \; 2>/dev/null || true
          xcrun simctl spawn "$udid" log show --last 15m --style compact --predicate 'process == "Munch"' > "$out/app.log" 2>/dev/null || true
          # The gallery's runtime token check (TroveTokenCheck): token names and hex values only.
          grep -ho 'TROVE TOKEN [A-Z]*: .*' "$out/app.log" | sort -u | head -40 || echo "TROVE TOKEN CHECK: no result in the app log"
          xcrun simctl delete "$udid"

      - name: Mint a write token for trove-renders
        id: renders-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.TROVE_RENDERS_APP_ID }}
          private-key: ${{ secrets.TROVE_RENDERS_APP_PRIVATE_KEY }}
          owner: Trove-Kitchen
          repositories: trove-renders

      - name: Commit the screenshots to trove-renders, never to this repository
        env:
          TOKEN: ${{ steps.renders-token.outputs.token }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          # The ref goes only to the private trove-renders repo; it is read here, not echoed in an env block.
          REF="$(jq -r '.inputs.ref // ""' "$GITHUB_EVENT_PATH")"; REF="${REF:-main}"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          dest="$RUNNER_TEMP/trove-renders"
          git -c http.extraheader="$auth" clone -q --depth 1 https://github.com/Trove-Kitchen/trove-renders.git "$dest"
          short="${SHA:0:12}"
          mkdir -p "$dest/$short/ios"
          cp "$RUNNER_TEMP/private/renders/"* "$dest/$short/ios/"
          python3 -I - "$dest" "$short" "$REF" "$SHA" "$GITHUB_RUN_ID" <<'PY'
          import json, os, shutil, sys, datetime
          dest, short, ref, sha, run = sys.argv[1:]
          shots = sorted(f for f in os.listdir(os.path.join(dest, short, "ios")) if f.endswith(".png"))
          with open(os.path.join(dest, short, "README.md"), "w") as out:
              out.write(f"# iOS renders of {ref} at {short}\n\nRun {run}. Simulator screenshots, light and dark:\n\n")
              out.write("- `recipes`, `mealPlan`, `grocery`, `profile`: the four tabs with demo data\n")
              out.write("- `recipe`, `cooking`: the Pancakes recipe page and guided cooking\n")
              out.write("- `components-1..3`: the component gallery (docs/design/components.md)\n\n")
              for f in shots:
                  out.write(f"![{f[:-4]}](ios/{f})\n")
          path = os.path.join(dest, "runs.json")
          runs = json.load(open(path)) if os.path.exists(path) else []
          runs = [r for r in runs if r.get("folder") != short]
          runs.insert(0, {"folder": short, "sha": sha, "ref": ref, "kind": "ios-renders", "run": run,
                          "at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")})
          for old in runs[10:]:
              shutil.rmtree(os.path.join(dest, old["folder"]), ignore_errors=True)
          json.dump(runs[:10], open(path, "w"), indent=2)
          PY
          cd "$dest"
          git config user.name "trove-kitchen-renders[bot]"
          git config user.email "trove-kitchen-renders[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "iOS renders of $REF at $short"
          for attempt in 1 2 3; do
            if git -c http.extraheader="$auth" push -q origin HEAD; then echo "pushed to trove-renders ${SHA:0:12}"; exit 0; fi
            git -c http.extraheader="$auth" pull -q --rebase origin HEAD
          done
          exit 1

      - name: Remove private source, logs, products and screenshots
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/trove-source" "$RUNNER_TEMP/private" "$RUNNER_TEMP/derived" "$RUNNER_TEMP/trove-renders"
