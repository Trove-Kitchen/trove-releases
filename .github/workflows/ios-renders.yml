name: Trove iOS renders

# Builds Trove for the simulator at a Munch ref and screenshots each tab on an
# iPhone simulator, in light and dark mode, with the debug launch flags the app
# already supports (MUNCH_SKIP_ONBOARDING, MUNCH_SEED_DEMO, MUNCH_START_TAB).
#
# Screenshots show the app, so they never land here in the clear: they are
# encrypted with age to TROVE_RENDERS_AGE_RECIPIENT (a repository variable
# holding a public key) and uploaded as one artifact. Decrypt with
#   age -d -i key.txt renders.tar.age | tar -x

run-name: 'Trove iOS renders of ${{ inputs.ref }}'

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Munch branch, tag or commit
        required: true
        default: main
        type: string
      device:
        description: Simulator device name
        required: false
        default: iPhone 16 Pro
        type: string

concurrency:
  group: trove-ios-renders-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: macos-15
    environment: trove-compile
    timeout-minutes: 60
    env:
      BUNDLE_ID: ade-studios.Munch-RKCK
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require the age recipient before building
        env:
          RECIPIENT: ${{ vars.TROVE_RENDERS_AGE_RECIPIENT }}
        run: |
          if ! printf '%s' "$RECIPIENT" | grep -Eq '^age1[0-9a-z]{58}$'; then
            echo "Set the repository variable TROVE_RENDERS_AGE_RECIPIENT to an age public key."; exit 1
          fi
          brew install age >/dev/null

      - id: source
        uses: ./.github/actions/fetch-source
        with:
          ref: ${{ inputs.ref }}
          munch_key: ${{ secrets.TROVE_MUNCH_READ_KEY }}
          commerce_key: ${{ secrets.TROVE_COMMERCE_READ_KEY }}

      - name: Build for the simulator without signing
        working-directory: ${{ runner.temp }}/trove-source
        run: |
          mkdir -p "$RUNNER_TEMP/private"
          xcodebuild \
            -workspace Munch.xcworkspace \
            -scheme Munch \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/private/build.log" 2>&1 \
            || { python3 -I "$GITHUB_WORKSPACE/tools/report.py" xcode "$RUNNER_TEMP/private/build.log" /dev/null; echo "Build failed; run Trove iOS compile for the errors."; exit 1; }
          echo "build passed"

      - name: Screenshot each tab in light and dark
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          app="$(find "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)"
          udid="$(xcrun simctl create trove-renders "$DEVICE")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b >/dev/null
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$udid" "$app"
          out="$RUNNER_TEMP/private/renders" && mkdir -p "$out"
          for appearance in light dark; do
            xcrun simctl ui "$udid" appearance "$appearance"
            for tab in recipes mealPlan grocery profile; do
              xcrun simctl terminate "$udid" "$BUNDLE_ID" 2>/dev/null || true
              SIMCTL_CHILD_MUNCH_SEED_DEMO=1 SIMCTL_CHILD_MUNCH_START_TAB="$tab" \
                xcrun simctl launch "$udid" "$BUNDLE_ID" MUNCH_SKIP_ONBOARDING >/dev/null
              sleep 8
              xcrun simctl io "$udid" screenshot "$out/$appearance-$tab.png" >/dev/null 2>&1
            done
          done
          echo "$(ls "$out" | wc -l | tr -d ' ') screenshots"
          xcrun simctl delete "$udid"

      - name: Seal the screenshots
        env:
          RECIPIENT: ${{ vars.TROVE_RENDERS_AGE_RECIPIENT }}
        run: |
          tar -C "$RUNNER_TEMP/private" -cf - renders | age -r "$RECIPIENT" -o "$RUNNER_TEMP/renders.tar.age"
          echo "sealed $(wc -c < "$RUNNER_TEMP/renders.tar.age" | tr -d ' ') bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: trove-renders-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/renders.tar.age
          retention-days: 14

      - name: Remove private source, logs, products and plain screenshots
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/trove-source" "$RUNNER_TEMP/private" "$RUNNER_TEMP/derived"
