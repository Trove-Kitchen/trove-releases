name: Trove Android unit tests

# Runs the Android app's unit tests (:app:testDebugUnitTest) at a trove-app ref on
# a free Linux runner. Like the iOS compile, this log shows pass/fail and
# counts only; failing test names and messages go to the trove-app pull request.

run-name: 'Trove Android unit tests${{ inputs.pr_number && format('' of trove-app #{0}'', inputs.pr_number) || (!inputs.ref || inputs.ref == ''main'') && '' of main'' || '''' }}'

on:
  workflow_dispatch:
    inputs:
      ref:
        description: trove-app branch, tag or commit
        required: true
        default: main
        type: string
      pr_number:
        description: trove-app pull request to post the result on (optional)
        required: false
        type: string
  # Changing this check runs it once on its own pull request, against trove-app main.
  # Pull requests from forks get no secrets, so they cannot reach the source.
  pull_request:
    paths:
      - .github/workflows/android-unit.yml
      - .github/actions/fetch-source/**
      - tools/report.py

concurrency:
  # By pull request or run, never by branch name: a group's name can show in this public log.
  group: trove-android-unit-${{ (inputs.pr_number && format('pr-{0}', inputs.pr_number)) || (github.event_name == 'pull_request' && github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Mint a read-only token for the source
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.TROVE_CI_APP_ID }}
          private-key: ${{ secrets.TROVE_CI_APP_PRIVATE_KEY }}
          owner: Trove-Kitchen
          repositories: trove-app
          permission-contents: read

      # trove-app branch names are private and a step's inputs are echoed in this
      # public log, so the ref is read from the event and only its commit is used.
      - name: Resolve the ref to a commit, printing no branch name
        id: commit
        env:
          TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          ref="$(jq -r '.inputs.ref // ""' "$GITHUB_EVENT_PATH")"
          [ -n "$ref" ] || ref=main
          if printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            sha="$ref"
          else
            printf '%s' "$ref" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$' || { echo "ref must be a branch, tag or full commit"; exit 1; }
            auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            echo "::add-mask::$auth"
            # A branch first, then a tag's commit.
            sha="$(git -c http.extraheader="$auth" ls-remote https://github.com/Trove-Kitchen/trove-app.git \
              "refs/heads/$ref" "refs/tags/$ref" | awk -v r="$ref" '
                $2 == "refs/heads/" r { h = $1 } $2 == "refs/tags/" r "^{}" { p = $1 } $2 == "refs/tags/" r { t = $1 }
                END { print h ? h : (p ? p : t) }')"
          fi
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "ref is not a trove-app branch, tag or full commit"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - id: source
        uses: ./.github/actions/fetch-source
        with:
          ref: ${{ steps.commit.outputs.sha }}
          token: ${{ steps.source-token.outputs.token }}

      - name: Run the unit tests without any credential
        id: test
        working-directory: ${{ runner.temp }}/trove-source/android
        run: |
          mkdir -p "$RUNNER_TEMP/private"
          set +e
          gradle --no-daemon --console=plain :app:testDebugUnitTest > "$RUNNER_TEMP/private/gradle.log" 2>&1
          status=$?
          set -e
          python3 -I "$GITHUB_WORKSPACE/tools/report.py" junit app/build/test-results "$RUNNER_TEMP/private/errors.md"
          python3 -I "$GITHUB_WORKSPACE/tools/report.py" xcode "$RUNNER_TEMP/private/gradle.log" "$RUNNER_TEMP/private/compile.md" >/dev/null
          if [ $status -ne 0 ] && [ ! -s "$RUNNER_TEMP/private/errors.md" ]; then
            # No test failed, so the build itself did: Kotlin errors read "e: file:///path:line:col message".
            grep -E '^e: ' "$RUNNER_TEMP/private/gradle.log" \
              | sed -E "s#file://$RUNNER_TEMP/trove-source/##; s/^e: /- /" | head -50 > "$RUNNER_TEMP/private/errors.md" || true
            [ -s "$RUNNER_TEMP/private/errors.md" ] || echo "- The Gradle build failed before any test ran." > "$RUNNER_TEMP/private/errors.md"
          fi
          echo "android unit: $([ $status -eq 0 ] && echo passed || echo failed)"
          [ $status -eq 0 ] && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Mint a token that can only comment on the trove-app pull request
        id: comment-token
        if: always() && steps.test.outcome == 'success' && inputs.pr_number != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.TROVE_CI_APP_ID }}
          private-key: ${{ secrets.TROVE_CI_APP_PRIVATE_KEY }}
          owner: Trove-Kitchen
          repositories: trove-app
          permission-pull-requests: write

      - name: Post the result on the trove-app pull request, never in this log
        if: always() && steps.test.outcome == 'success'
        env:
          TROVE_PR_COMMENT_TOKEN: ${{ steps.comment-token.outputs.token }}
          PR: ${{ inputs.pr_number }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 -I tools/report.py post "Android unit tests" "$RUNNER_TEMP/private/errors.md" "$PR" "$SHA"
          [ "${{ steps.test.outputs.ok }}" = "true" ]

      - name: Remove private source and logs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/trove-source" "$RUNNER_TEMP/private"
