name: Trove iOS compile

# Compiles Trove for the simulator at a Munch ref, with no signing, no Apple
# key and no backend, and runs the MunchMatching package tests. The quickest
# answer to "does this branch build?" for agents that have no Mac.
#
# This repository is public and Munch is private: the build log stays on the
# runner, this log shows pass/fail and counts, and the errors (path:line and
# the compiler's message) are posted only on the Munch pull request, when
# pr_number is given and TROVE_MUNCH_PR_COMMENT_TOKEN is set.

run-name: 'Trove iOS compile of ${{ inputs.ref }}${{ inputs.pr_number && format('' (Munch #{0})'', inputs.pr_number) || '''' }}'

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Munch branch, tag or commit
        required: true
        default: main
        type: string
      pr_number:
        description: Munch pull request to post the result on (optional)
        required: false
        type: string

concurrency:
  group: trove-ios-compile-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-15
    environment: trove-compile
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: source
        uses: ./.github/actions/fetch-source
        with:
          ref: ${{ inputs.ref }}
          munch_key: ${{ secrets.TROVE_MUNCH_READ_KEY }}
          commerce_key: ${{ secrets.TROVE_COMMERCE_READ_KEY }}

      - name: Show the Xcode on this Mac
        run: xcodebuild -version

      - name: Compile for the simulator without signing
        id: build
        working-directory: ${{ runner.temp }}/trove-source
        run: |
          mkdir -p "$RUNNER_TEMP/private"
          set +e
          xcodebuild \
            -workspace Munch.xcworkspace \
            -scheme Munch \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/private/build.log" 2>&1
          status=$?
          (cd MunchMatching && swift test) > "$RUNNER_TEMP/private/swift-test.log" 2>&1
          tests=$?
          set -e
          cat "$RUNNER_TEMP/private/swift-test.log" >> "$RUNNER_TEMP/private/build.log"
          python3 -I "$GITHUB_WORKSPACE/tools/report.py" xcode "$RUNNER_TEMP/private/build.log" "$RUNNER_TEMP/private/errors.md"
          echo "app build: $([ $status -eq 0 ] && echo passed || echo failed)"
          echo "MunchMatching tests: $([ $tests -eq 0 ] && echo passed || echo failed) ($(grep -Eo 'Executed [0-9]+ tests?, with [0-9]+ failures?' "$RUNNER_TEMP/private/swift-test.log" | tail -1))"
          if [ $status -ne 0 ] && [ ! -s "$RUNNER_TEMP/private/errors.md" ]; then
            echo "- The build failed without a compiler error (signing, packages or project settings)." > "$RUNNER_TEMP/private/errors.md"
          fi
          if [ $tests -ne 0 ]; then
            grep -E "error: |failed \(" "$RUNNER_TEMP/private/swift-test.log" | grep -v '^/' | sed -E 's/^/- /' | head -20 >> "$RUNNER_TEMP/private/errors.md" || true
            [ -s "$RUNNER_TEMP/private/errors.md" ] || echo "- MunchMatching tests failed." > "$RUNNER_TEMP/private/errors.md"
          fi
          [ $status -eq 0 ] && [ $tests -eq 0 ] && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Post the result on the Munch pull request, never in this log
        if: always() && steps.build.outcome == 'success'
        env:
          TROVE_MUNCH_PR_COMMENT_TOKEN: ${{ secrets.TROVE_MUNCH_PR_COMMENT_TOKEN }}
          PR: ${{ inputs.pr_number }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 -I tools/report.py post "iOS compile" "$RUNNER_TEMP/private/errors.md" "$PR" "$SHA"
          [ "${{ steps.build.outputs.ok }}" = "true" ]

      - name: Remove private source, logs and products
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/trove-source" "$RUNNER_TEMP/private" "$RUNNER_TEMP/derived"
