name: Trove iOS compile

# Compiles Trove for the simulator at a trove-app ref, with no signing, no Apple
# key and no backend, and runs the MunchMatching package tests. The quickest
# answer to "does this branch build?" for agents that have no Mac.
#
# This repository is public and trove-app is private: the build log stays on the
# runner, this log shows pass/fail and counts, and the errors (path:line and
# the compiler's message) are posted only on the trove-app pull request, when
# pr_number is given and TROVE_PR_COMMENT_TOKEN is set.

run-name: 'Trove iOS compile${{ inputs.pr_number && format('' of trove-app #{0}'', inputs.pr_number) || (!inputs.ref || inputs.ref == ''main'') && '' of main'' || '''' }}'

on:
  workflow_dispatch:
    inputs:
      ref:
        description: trove-app branch, tag or commit
        required: true
        default: main
        type: string
      pr_number:
        description: trove-app pull request to post the result on (optional)
        required: false
        type: string
  # Changing this check runs it once on its own pull request, against trove-app main.
  # Pull requests from forks get no secrets, so they cannot reach the source.
  pull_request:
    paths:
      - .github/workflows/ios-compile.yml
      - .github/actions/fetch-source/**
      - tools/report.py

concurrency:
  # By pull request or run, never by branch name: a group's name can show in this public log.
  group: trove-ios-compile-${{ (inputs.pr_number && format('pr-{0}', inputs.pr_number)) || (github.event_name == 'pull_request' && github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Mint a read-only token for the source
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.TROVE_CI_APP_ID }}
          private-key: ${{ secrets.TROVE_CI_APP_PRIVATE_KEY }}
          owner: Trove-Kitchen
          repositories: trove-app,trove-commerce

      # trove-app branch names are private and a step's inputs are echoed in this
      # public log, so the ref is read from the event and only its commit is used.
      - name: Resolve the ref to a commit, printing no branch name
        id: commit
        env:
          TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          ref="$(jq -r '.inputs.ref // ""' "$GITHUB_EVENT_PATH")"
          [ -n "$ref" ] || ref=main
          if printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            sha="$ref"
          else
            printf '%s' "$ref" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$' || { echo "ref must be a branch, tag or full commit"; exit 1; }
            auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
            echo "::add-mask::$auth"
            # A branch first, then a tag's commit.
            sha="$(git -c http.extraheader="$auth" ls-remote https://github.com/Trove-Kitchen/trove-app.git \
              "refs/heads/$ref" "refs/tags/$ref" | awk -v r="$ref" '
                $2 == "refs/heads/" r { h = $1 } $2 == "refs/tags/" r "^{}" { p = $1 } $2 == "refs/tags/" r { t = $1 }
                END { print h ? h : (p ? p : t) }')"
          fi
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "ref is not a trove-app branch, tag or full commit"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - id: source
        uses: ./.github/actions/fetch-source
        with:
          ref: ${{ steps.commit.outputs.sha }}
          token: ${{ steps.source-token.outputs.token }}
          with_commerce: 'true'

      - name: Show the Xcode on this Mac
        run: xcodebuild -version

      - name: Compile for the simulator without signing
        id: build
        working-directory: ${{ runner.temp }}/trove-source
        run: |
          mkdir -p "$RUNNER_TEMP/private"
          set +e
          xcodebuild \
            -workspace Munch.xcworkspace \
            -scheme Munch \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/private/build.log" 2>&1
          status=$?
          (cd MunchMatching && swift test) > "$RUNNER_TEMP/private/swift-test.log" 2>&1
          tests=$?
          set -e
          cat "$RUNNER_TEMP/private/swift-test.log" >> "$RUNNER_TEMP/private/build.log"
          python3 -I "$GITHUB_WORKSPACE/tools/report.py" xcode "$RUNNER_TEMP/private/build.log" "$RUNNER_TEMP/private/errors.md"
          echo "app build: $([ $status -eq 0 ] && echo passed || echo failed)"
          # The share extension is its own target, embedded in the app; say so explicitly.
          appex="$(find "$RUNNER_TEMP/derived/Build/Products" -path '*Munch.app/PlugIns/MunchShareExtension.appex' -maxdepth 4 2>/dev/null | head -1)"
          echo "share extension: $([ -n "$appex" ] && [ -f "$appex/MunchShareExtension" ] && echo "built and embedded" || echo "not built")"
          echo "MunchMatching tests: $([ $tests -eq 0 ] && echo passed || echo failed) ($(grep -Eo 'Executed [0-9]+ tests?, with [0-9]+ failures?' "$RUNNER_TEMP/private/swift-test.log" | tail -1))"
          if [ $status -ne 0 ] && [ ! -s "$RUNNER_TEMP/private/errors.md" ]; then
            echo "- The build failed without a compiler error (signing, packages or project settings)." > "$RUNNER_TEMP/private/errors.md"
          fi
          if [ $tests -ne 0 ]; then
            grep -E "error: |failed \(" "$RUNNER_TEMP/private/swift-test.log" | grep -v '^/' | sed -E 's/^/- /' | head -20 >> "$RUNNER_TEMP/private/errors.md" || true
            [ -s "$RUNNER_TEMP/private/errors.md" ] || echo "- MunchMatching tests failed." > "$RUNNER_TEMP/private/errors.md"
          fi
          [ $status -eq 0 ] && [ $tests -eq 0 ] && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Post the result on the trove-app pull request, never in this log
        if: always() && steps.build.outcome == 'success'
        env:
          TROVE_PR_COMMENT_TOKEN: ${{ secrets.TROVE_PR_COMMENT_TOKEN }}
          PR: ${{ inputs.pr_number }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 -I tools/report.py post "iOS compile" "$RUNNER_TEMP/private/errors.md" "$PR" "$SHA"
          [ "${{ steps.build.outputs.ok }}" = "true" ]

      # Without a pull request there's nowhere private to post the errors, and
      # they never go in this public log. Write them to the private
      # trove-renders repo instead, next to that commit's renders.
      - name: Mint a write token for trove-renders
        id: renders-token
        if: always() && steps.build.outputs.ok == 'false' && inputs.pr_number == ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.TROVE_RENDERS_APP_ID }}
          private-key: ${{ secrets.TROVE_RENDERS_APP_PRIVATE_KEY }}
          owner: Trove-Kitchen
          repositories: trove-renders

      - name: Commit the errors to trove-renders, never to this log
        if: always() && steps.renders-token.outcome == 'success'
        env:
          TOKEN: ${{ steps.renders-token.outputs.token }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          # The ref goes only to the private trove-renders repo; it is read here, not echoed in an env block.
          REF="$(jq -r '.inputs.ref // ""' "$GITHUB_EVENT_PATH")"; REF="${REF:-main}"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          dest="$RUNNER_TEMP/trove-renders"
          git -c http.extraheader="$auth" clone -q --depth 1 https://github.com/Trove-Kitchen/trove-renders.git "$dest"
          short="${SHA:0:12}"
          mkdir -p "$dest/$short"
          { echo "# iOS compile errors for $REF at $short"; echo; echo "Run $GITHUB_RUN_ID."; echo; cat "$RUNNER_TEMP/private/errors.md"; } > "$dest/$short/compile-errors.md"
          cd "$dest"
          git config user.name "trove-kitchen-renders[bot]"
          git config user.email "trove-kitchen-renders[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "iOS compile errors for $REF at $short"
          for attempt in 1 2 3; do
            if git -c http.extraheader="$auth" push -q origin HEAD; then echo "errors written to trove-renders $short/compile-errors.md"; exit 0; fi
            git -c http.extraheader="$auth" pull -q --rebase origin HEAD
          done
          exit 1

      - name: Remove private source, logs and products
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/trove-source" "$RUNNER_TEMP/private" "$RUNNER_TEMP/derived" "$RUNNER_TEMP/trove-renders"
