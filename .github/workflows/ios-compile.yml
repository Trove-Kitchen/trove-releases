name: Trove iOS compile

# Compiles Trove for the simulator at a trove-app ref, with no signing, no Apple
# key and no backend, and runs the MunchMatching package tests. The quickest
# answer to "does this branch build?" for agents that have no Mac.
#
# This repository is public and trove-app is private: the build log stays on the
# runner, this log shows pass/fail and counts, and the errors (path:line and
# the compiler's message) are posted only on the trove-app pull request, when
# pr_number is given and TROVE_PR_COMMENT_TOKEN is set.

run-name: 'Trove iOS compile of ${{ inputs.ref || ''main'' }}${{ inputs.pr_number && format('' (trove-app #{0})'', inputs.pr_number) || '''' }}'

on:
  workflow_dispatch:
    inputs:
      ref:
        description: trove-app branch, tag or commit
        required: true
        default: main
        type: string
      pr_number:
        description: trove-app pull request to post the result on (optional)
        required: false
        type: string
  # Changing this check runs it once on its own pull request, against trove-app main.
  # Pull requests from forks get no secrets, so they cannot reach the source.
  pull_request:
    paths:
      - .github/workflows/ios-compile.yml
      - .github/actions/fetch-source/**
      - tools/report.py

concurrency:
  group: trove-ios-compile-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Mint a read-only token for the source
        id: source-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TROVE_CI_APP_ID }}
          private-key: ${{ secrets.TROVE_CI_APP_PRIVATE_KEY }}
          owner: Trove-Kitchen
          repositories: trove-app,trove-commerce

      - id: source
        uses: ./.github/actions/fetch-source
        with:
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ steps.source-token.outputs.token }}
          with_commerce: 'true'

      - name: Show the Xcode on this Mac
        run: xcodebuild -version

      - name: Compile for the simulator without signing
        id: build
        working-directory: ${{ runner.temp }}/trove-source
        run: |
          mkdir -p "$RUNNER_TEMP/private"
          set +e
          xcodebuild \
            -workspace Munch.xcworkspace \
            -scheme Munch \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/private/build.log" 2>&1
          status=$?
          (cd MunchMatching && swift test) > "$RUNNER_TEMP/private/swift-test.log" 2>&1
          tests=$?
          set -e
          cat "$RUNNER_TEMP/private/swift-test.log" >> "$RUNNER_TEMP/private/build.log"
          python3 -I "$GITHUB_WORKSPACE/tools/report.py" xcode "$RUNNER_TEMP/private/build.log" "$RUNNER_TEMP/private/errors.md"
          echo "app build: $([ $status -eq 0 ] && echo passed || echo failed)"
          echo "MunchMatching tests: $([ $tests -eq 0 ] && echo passed || echo failed) ($(grep -Eo 'Executed [0-9]+ tests?, with [0-9]+ failures?' "$RUNNER_TEMP/private/swift-test.log" | tail -1))"
          if [ $status -ne 0 ] && [ ! -s "$RUNNER_TEMP/private/errors.md" ]; then
            echo "- The build failed without a compiler error (signing, packages or project settings)." > "$RUNNER_TEMP/private/errors.md"
          fi
          if [ $tests -ne 0 ]; then
            grep -E "error: |failed \(" "$RUNNER_TEMP/private/swift-test.log" | grep -v '^/' | sed -E 's/^/- /' | head -20 >> "$RUNNER_TEMP/private/errors.md" || true
            [ -s "$RUNNER_TEMP/private/errors.md" ] || echo "- MunchMatching tests failed." > "$RUNNER_TEMP/private/errors.md"
          fi
          [ $status -eq 0 ] && [ $tests -eq 0 ] && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"

      - name: Post the result on the trove-app pull request, never in this log
        if: always() && steps.build.outcome == 'success'
        env:
          TROVE_PR_COMMENT_TOKEN: ${{ secrets.TROVE_PR_COMMENT_TOKEN }}
          PR: ${{ inputs.pr_number }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 -I tools/report.py post "iOS compile" "$RUNNER_TEMP/private/errors.md" "$PR" "$SHA"
          [ "${{ steps.build.outputs.ok }}" = "true" ]

      - name: Remove private source, logs and products
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/trove-source" "$RUNNER_TEMP/private" "$RUNNER_TEMP/derived"
